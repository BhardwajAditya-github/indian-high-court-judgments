name: NyaySaathi Multi-Court Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-court-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TZ: Asia/Kolkata

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --------------------------------------------------
      # 3. Dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      # --------------------------------------------------
      # 4. Verify imports
      # --------------------------------------------------
      - name: Verify application startup
        run: |
          python -c "import download; print('download import: OK')"
          python -c "import judgment_processor; print('judgment_processor import: OK')"
          python -c "import run; print('run import: OK')"

      # --------------------------------------------------
      # 5. Verify Supabase environment variables
      # --------------------------------------------------
      - name: Verify environment
        run: |
          python - <<'PY'
          import os

          required = [
              "SUPABASE_URL",
              "SUPABASE_SERVICE_ROLE_KEY",
          ]

          for name in required:
              value = os.getenv(name)

              if not value:
                  raise RuntimeError(f"{name} is missing")

              print(f"{name}: present")

          print("Environment check: OK")
          PY

      # --------------------------------------------------
      # 6. Run controlled six-court test
      #
      # IMPORTANT:
      # 2026-09-08 = Tuesday
      # - not today
      # - not Sunday
      # - chosen as a normal working day
      #
      # Replace the four TODO codes below with the
      # additional known-valid court codes.
      # --------------------------------------------------
      - name: Run six-court test
        run: |
          python run.py \
            --court_codes "2~5,9~13,14~25,1~12" \
            --start_date "2026-09-08" \
            --end_date "2026-09-08" \
            --max_workers 2 \
            --no-default-dist-codes \
            --no-compress-pdfs

      # --------------------------------------------------
      # 7. Final status
      # --------------------------------------------------
      - name: Report completion
        if: always()
        run: |
          echo "=========================================="
          echo "NyaySaathi six-court test finished"
          echo "=========================================="
          echo "Courts tested: 2~5,9~13,14~25,1~12"
          echo "Date tested:   2026-09-08"
          echo "Workers:       2"
          echo "=========================================="
