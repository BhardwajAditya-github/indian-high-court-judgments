name: NyaySaathi Daily Judgment Scrape

on:
  schedule:
    # 5:00 AM IST = 11:30 PM UTC (previous day)
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TZ: Asia/Kolkata

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --------------------------------------------------
      # 3. Dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      # --------------------------------------------------
      # 4. Verify application startup
      # --------------------------------------------------
      - name: Verify application startup
        run: |
          python -c "import download; print('download import: OK')"
          python -c "import judgment_processor; print('judgment_processor import: OK')"
          python -c "import run; print('run import: OK')"

      # --------------------------------------------------
      # 5. Verify environment
      # --------------------------------------------------
      - name: Verify environment
        run: |
          python - <<'PY'
          import os

          required = [
              "SUPABASE_URL",
              "SUPABASE_SERVICE_ROLE_KEY",
          ]

          for name in required:
              value = os.getenv(name)

              if not value:
                  raise RuntimeError(f"{name} is missing")

              print(f"{name}: present")

          print("Environment check: OK")
          PY

      # --------------------------------------------------
      # 6. Calculate yesterday's date (IST)
      # --------------------------------------------------
      - name: Calculate yesterday's date (IST)
        id: date
        run: |
          YESTERDAY=$(TZ=Asia/Kolkata date -d "yesterday" +%Y-%m-%d)

          echo "yesterday=$YESTERDAY" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "NyaySaathi Daily Scrape"
          echo "=========================================="
          echo "Scraping date: $YESTERDAY (IST)"
          echo "Current date:  $(TZ=Asia/Kolkata date +%Y-%m-%d) (IST)"
          echo "Current time:  $(TZ=Asia/Kolkata date +%H:%M:%S) (IST)"
          echo "=========================================="

      # --------------------------------------------------
      # 7. Run daily NyaySaathi pipeline
      #
      # IMPORTANT:
      # run.py now handles the complete lifecycle:
      #
      #   SCRAPER
      #      ↓
      #   wait for scraper to EXIT
      #      ↓
      #   PROCESSOR
      #      ↓
      #   drain orders/
      #      ↓
      #   stop processor
      #
      # The processor is NOT started concurrently.
      # --------------------------------------------------
      - name: Run daily NyaySaathi pipeline
        run: |
          python run.py \
            --court_codes "9~13,27~1,19~16,18~6,36~29,28~2,22~18,7~26,24~17,2~5,1~12,20~7,29~3,32~4,23~23,14~25,17~21,21~11,3~22,8~9,11~24,16~20,5~15,33~10,10~8" \
            --start_date "${{ steps.date.outputs.yesterday }}" \
            --end_date "${{ steps.date.outputs.yesterday }}" \
            --max_workers 2 \
            --no-default-dist-codes \
            --no-compress-pdfs

      # --------------------------------------------------
      # 8. Report completion
      # --------------------------------------------------
      - name: Report completion
        if: always()
        run: |
          echo "=========================================="
          echo "NyaySaathi Daily Scrape Workflow Finished"
          echo "=========================================="
          echo "Scrape date: ${{ steps.date.outputs.yesterday }} (IST)"
          echo "Courts:       25"
          echo "Workers:      2"
          echo "=========================================="
